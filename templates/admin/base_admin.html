
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Quản trị nhà sách{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" href="{{ url_for('admin_books') }}">
        NHÀ SÁCH SÔNG HƯƠNG
    </a>

    <span class="text-white-50 small">Khu vực quản trị</span>
</nav>

<div class="container-fluid">
    <div class="row">

        <!-- SIDEBAR -->
        <aside class="col-md-2 bg-white border-end min-vh-100 p-3">

            <h6 class="text-secondary mb-3">QUẢN LÝ</h6>

            <div class="nav flex-column gap-2">

                <a href="{{ url_for('admin_books') }}"
                   class="nav-link text-dark">
                    Sách
                </a>

                <a href="{{ url_for('admin_categories') }}"
                   class="nav-link text-dark">
                    Danh mục
                </a>

                <a href="{{ url_for('admin_books') }}"
                   class="nav-link text-dark">
                    Trang quản lý sách
                </a>

            </div>

        </aside>

        <!-- MAIN CONTENT -->
        <main class="col-md-10 p-4">

            <!-- FLASH MESSAGE -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert-dismissible fade show">
                            {{ message }}

                            <button type="button"
                                    class="btn-close"
                                    data-bs-dismiss="alert">
                            </button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            {% block content %}{% endblock %}

        </main>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
